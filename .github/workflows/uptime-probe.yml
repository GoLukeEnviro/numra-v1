name: Uptime Probe

# Vom Host unabhaengige Pruefung der oeffentlichen Readiness (nur ausgehende GETs,
# keine Secrets des Hosts). Bewertung, Alarm-Entscheidung und Tests:
# scripts/ops/uptime_probe.py, scripts/ops/uptime_alert.sh, scripts/ops/tests/.
# Details: docs/ops/numra-monitoring.md, "Externer Uptime-Probe".
# Ausfall dieses Monitors selbst meldet .github/workflows/uptime-watchdog.yml.

on:
  schedule:
    # Alle 15 Minuten. GitHub startet Cron-Laeufe oft verzoegert (teils mehrere Minuten,
    # zu Stundenbeginn mehr); einzelne Laeufe koennen ausfallen.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      target_url:
        description: "Zu pruefende URL (nur https://avenyth.de/...), z. B. fuer kontrollierte Fehlertests"
        required: false
        default: "https://avenyth.de/api/v1/health/ready"
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_URL: ${{ inputs.target_url || 'https://avenyth.de/api/v1/health/ready' }}
      ALERT_TITLE: "ALARM: avenyth.de Readiness nicht erreichbar/unhealthy"
      ALERT_LABEL: uptime-alert
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ops
          persist-credentials: false

      # Sollwerte wie scripts/ops/numra-healthcheck.sh (EXPECTED_DEPENDENCIES): database,
      # numerology_engine, llm und pdf sind alle required. URL-Allowlist inklusive.
      - name: Readiness pruefen
        id: probe
        run: python3 scripts/ops/uptime_probe.py probe

      - name: Alarm-Issue pflegen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROBE_OK: ${{ steps.probe.outputs.ok }}
          PROBE_WARN: ${{ steps.probe.outputs.warn }}
          PROBE_CODE: ${{ steps.probe.outputs.code }}
          PROBE_CATEGORY: ${{ steps.probe.outputs.category }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/ops/uptime_alert.sh

      - name: Warnung kennzeichnen
        if: steps.probe.outputs.ok == 'true' && steps.probe.outputs.warn == 'true'
        run: echo "::warning::Ein Dienst meldet degraded (kein Alarm)."

      - name: Lauf bei Fehlschlag rot markieren
        if: steps.probe.outputs.ok != 'true'
        run: exit 1
