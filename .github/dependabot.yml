version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      safe-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # react-native 0.87.x breaks apps/mobile's `tsc --noEmit` (every
      # StyleSheet.create object literal stops satisfying StyleProp<TextStyle>/
      # StyleProp<ViewStyle> in App.tsx) independent of the @types/react
      # version — see PR #227/#228. Re-enable once that's root-caused and fixed.
      - dependency-name: "react-native"
        versions: [">=0.87.0"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
