# RC2 Playwright real-journey overlay -- REALITY_CHECK_2 Phase 2.
#
# Used only with an explicit, isolated project name and this file layered on top
# of docker-compose.yml. The wrapper script scripts/rc2-e2e.sh sets the required
# interpolation vars and runs:
#
#   docker compose -p numra-rc2 -f docker-compose.yml -f docker-compose.rc2.yml ...
#
# It never touches the default `docker compose` project: a distinct project name
# gives distinct container names, network and named volumes, and every published
# host port is remapped off the defaults so a parallel `numra-v1` stack keeps its
# 5432 / 6379 / 4300 / 8000 / 3000.
#
# The V2 feature flags (via the flags-init job, profile audit-all-on) and
# ALLOW_SELF_SIGNUP / EMAIL_BACKEND=logging live here only -- never in
# docker-compose.yml, .env.example or any committed production default.
# ENVIRONMENT=test (set by the wrapper) is what permits EMAIL_BACKEND=logging,
# so no real verification/invite mail is ever sent.

services:
  postgres:
    # !override replaces the base list instead of appending to it, so the default
    # 5432 is not also published (Compose merges sequence fields by concatenation).
    ports: !override
      - "55432:5432"

  redis:
    ports: !override
      - "56379:6379"

  pdf:
    ports: !override
      - "44300:4300"

  # Einmaliger Flag-Bootstrap (PR #271): Feature-Flags kommen aus der DB, nicht mehr aus
  # AVENYTH_*_ENABLED. Die frische RC2-DB hat nur die Seed-Werte von Migration 04d4
  # (checkins/tasks/evidence_layer aus); die Journey braucht alle sieben V2-Flags an
  # (Check-ins, Aufgaben, Copilot, Evidence-Layer), also Profil audit-all-on --
  # wie der numra-audit-Stack.
  flags-init:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: api
    command: ["python", "-m", "numra_api.cli", "flags", "init", "--profile", "audit-all-on"]
    working_dir: /app/apps/api
    restart: "no"
    environment:
      DATABASE_URL: postgresql+asyncpg://numra:${POSTGRES_PASSWORD}@postgres:5432/numra
      SESSION_SECRET: ${SESSION_SECRET}
      ENVIRONMENT: ${ENVIRONMENT}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api:
    depends_on:
      flags-init:
        condition: service_completed_successfully
    environment:
      EMAIL_BACKEND: logging
      # redeem_url the API mints for LINK/EMAIL invitations, and the browser
      # Origin allowlist for state-changing /api/* calls -- both the remapped web
      # port, not the 3000 default.
      WEB_APP_BASE_URL: http://localhost:3100
      CORS_ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:3100"]'
    ports: !override
      - "58080:8000"

  web:
    ports: !override
      - "3100:3000"
