[project]
name = "numra-api"
version = "0.1.0"
description = "NUMRA stateless FastAPI boundary: HTTP contracts, auth, persistence orchestration."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.6",
  "email-validator>=2.1",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "redis>=5.0",
  "numra-numerology",
  "numra-interpretation",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/numra_api"]

[tool.uv.sources]
numra-numerology = { workspace = true }
numra-interpretation = { workspace = true }
