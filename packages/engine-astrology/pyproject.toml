[project]
name = "numra-astrology"
version = "0.1.0"
description = "NUMRA astrology engine interface. STATUS: FEATURE_DISABLED_NO_CANON — no astrological calculation is implemented in V1; this package exposes only a typed interface for future canon."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/numra_astrology"]
