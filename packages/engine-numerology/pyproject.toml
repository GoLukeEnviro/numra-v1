[project]
name = "numra-numerology"
version = "1.0.0"
description = "NUMRA deterministic numerology calculation engine — pure, no network/DB/LLM."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/numra_numerology"]
