relationship_type: OTHER
dimensions:
  communication:
    semantic_context_de: Wie beide Beteiligten in dieser Beziehung typischerweise miteinander sprechen
      -- Tonfall, Direktheit, Zuhoerverhalten. Eine deskriptive, bewusst allgemein gehaltene Linse auf
      Ausdrucksstil, keine Bewertung von richtig oder falsch.
    number_modifiers:
      '1': direkt, meinungsstark, ergreift oft die Initiative im Gespraech
      '2': einfuehlsam, sucht Konsens, vermeidet moeglicherweise klare Aussagen
      '3': ausdrucksstark, locker, bringt Leichtigkeit in den Austausch
      '4': sachlich, strukturiert, bevorzugt klare Absprachen
      '5': spontan, abwechslungsreich, meldet sich unregelmaessig
      '6': fragt in wechselnden Kontakten fuersorglich und oft aktiv nach dem Wohlergehen
      '7': reflektiert, waegt Worte ab, braucht Zeit vor einer Antwort
      '8': zielgerichtet, bringt Themen pragmatisch auf den Punkt
      '9': offen, interessiert an groesseren Zusammenhaengen
      '11': nimmt in wechselnden Kontakten intuitiv Stimmungen des Gegenuebers schnell wahr
      '22': strukturiert und weitblickend zugleich
      '33': warmherzig, stellt eigene Anliegen im Gespraech oft zurueck
  closeness:
    semantic_context_de: Wie Naehe und Verbundenheit in dieser Beziehung typischerweise erlebt werden
      -- Haeufigkeit des Kontakts, emotionale Tiefe, bevorzugte Formen des Austauschs. Bewusst neutral
      gehalten, nicht auf eine bestimmte Beziehungsform festgelegt.
    number_modifiers:
      '1': schaetzt Naehe in loseren Kontakten, die die eigene Unabhaengigkeit nicht einschraenkt
      '2': sucht auch in loseren Kontakten regelmaessigen, verlaesslichen Austausch
      '3': erlebt Naehe ueber gemeinsame Erlebnisse und Leichtigkeit
      '4': baut Naehe in wechselnden Kontakten langsam ueber Verlaesslichkeit auf
      '5': erlebt Naehe in wechselnden Kontakten episodisch, oft nur zu bestimmten Anlaessen
      '6': zeigt Naehe in wechselnden Kontakten durch praktische Unterstuetzung und Fuersorge
      '7': braucht auch bei Naehe klare Rueckzugsraeume
      '8': verbindet Naehe oft mit gemeinsamen Vorhaben oder Zielen
      '9': erlebt Naehe in wechselnden Kontakten als Teil eines groesseren, mitfuehlenden Miteinanders
      '11': erlebt Naehe intensiv und intuitiv
      '22': verbindet Naehe in wechselnden Kontakten mit langfristig gemeinsam verfolgten Vorhaben
      '33': gibt viel in dieser Beziehung, sollte auf Gegenseitigkeit achten
  autonomy:
    semantic_context_de: Wie viel eigenstaendiger Raum -- Zeit, Entscheidungen, eigene Interessen -- innerhalb
      dieser Beziehung typischerweise gebraucht wird, unabhaengig von der Naehe zum Gegenueber.
    number_modifiers:
      '1': legt auch in loseren Kontakten Wert auf eigenstaendige Entscheidungen
      '2': orientiert sich in wechselnden Kontakten stark am jeweiligen Miteinander
      '3': sucht in wechselnden Kontakten Raum fuer eigene Ausdrucksformen
      '4': definiert Freiraum in wechselnden Kontakten oft ueber klare eigene Zustaendigkeiten
      '5': braucht in wechselnden Kontakten viel Freiheit und reagiert empfindlich auf Einengung
      '6': stellt in wechselnden Kontakten eigenen Freiraum haeufig hinter die Beduerfnisse anderer zurueck
      '7': braucht auch in loseren Kontakten ungestoerten Rueckzug und eigenen Gedankenraum
      '8': braucht Autonomie vor allem in zielbezogenen Bereichen
      '9': definiert Freiraum in wechselnden Kontakten oft ueber Sinn- und Wertefragen
      '11': braucht in wechselnden Kontakten Zeit, sensible Eindruecke fuer sich zu verarbeiten
      '22': sucht Freiraum vor allem dort, wo groessere gemeinsame Vorhaben entstehen koennen
      '33': sollte in loseren Kontakten aktiv eigenen Freiraum benennen, statt ihn unbemerkt aufzugeben
  needs:
    semantic_context_de: Beschreibende Reflexion typischer emotionaler Grundbeduerfnisse innerhalb dieser
      Beziehung -- Anerkennung, Sicherheit, Anregung, Verlaesslichkeit. Ein symbolisches Deutungsangebot,
      keine klinische Einordnung.
    number_modifiers:
      '1': braucht in wechselnden Kontakten Anerkennung der eigenen Initiative und Eigenstaendigkeit
      '2': braucht in wechselnden Kontakten Verlaesslichkeit und das Gefuehl, gebraucht zu werden
      '3': braucht in wechselnden Kontakten Wertschaetzung fuer Lebendigkeit und Ausdrucksfreude
      '4': braucht in wechselnden Kontakten Sicherheit durch klare Absprachen und Verlaesslichkeit
      '5': braucht in wechselnden Kontakten Abwechslung und das Gefuehl, nicht eingeengt zu sein
      '6': braucht in wechselnden Kontakten Wertschaetzung der eigenen Fuersorge, ohne sie als selbstverstaendlich
        zu nehmen
      '7': braucht in wechselnden Kontakten Respekt vor dem eigenen Rueckzugsbeduerfnis
      '8': Anerkennung von Einsatz und gemeinsamer Zielverfolgung
      '9': braucht in wechselnden Kontakten das Gefuehl, dass die eigenen Ideale geteilt oder respektiert
        werden
      '11': braucht in wechselnden Kontakten Verstaendnis fuer die eigene emotionale Sensibilitaet
      '22': braucht in wechselnden Kontakten Unterstuetzung fuer langfristige, groessere Vorhaben
      '33': braucht in wechselnden Kontakten Ausgleich -- das eigene Geben sollte auch erwidert werden
  conflict_dynamics:
    semantic_context_de: Wie Spannungen in dieser Beziehung typischerweise entstehen und ausgetragen werden
      -- symbolisch aus dem Zahlenprofil gelesen, nie als Vorhersage, sondern als Reflexionsangebot.
    number_modifiers:
      '1': neigt bei Widerstand in loseren Kontakten zu Ungeduld oder Alleingaengen
      '2': neigt bei Spannung zu Konfliktvermeidung statt offener Aussprache
      '3': neigt in wechselnden Kontakten zu Ablenkung oder Themenwechsel statt Klaerung
      '4': neigt in wechselnden Kontakten zu Rigiditaet und Festhalten am eigenen Standpunkt
      '5': neigt in wechselnden Kontakten zu Rueckzug in Ablenkung statt Auseinandersetzung
      '6': neigt in wechselnden Kontakten zu Ueberverantwortung -- uebernimmt Schuld, um Frieden zu wahren
      '7': neigt in wechselnden Kontakten zu emotionalem Rueckzug und Distanz statt Aussprache
      '8': neigt in wechselnden Kontakten zu Kontrolle und Machtkonflikten statt Kompromiss
      '9': neigt in wechselnden Kontakten zu Selbstaufgabe, um Harmonie zu erzwingen
      '11': neigt in wechselnden Kontakten zu Ueberempfindlichkeit bei wahrgenommener Kritik
      '22': neigt in wechselnden Kontakten dazu, grosse Plaene ueber akute Spannungen zu stellen
      '33': neigt in wechselnden Kontakten dazu, eigene Grenzen zu spaet zu setzen
  strengths:
    semantic_context_de: Woraus diese Beziehung typischerweise Kraft zieht -- komplementaere oder gemeinsame
      Staerken beider Zahlen, symbolisch gelesen, nicht als Garantie.
    number_modifiers:
      '1': bringt in wechselnden Kontakten Initiative und klare Richtung ein
      '2': bringt in wechselnde Kontakte Ausgleich, Kooperationsbereitschaft und Feingefuehl ein
      '3': bringt in wechselnde Kontakte Leichtigkeit, Ausdrucksfreude und Verbindungskraft ein
      '4': bringt in wechselnde Kontakte Verlaesslichkeit und praktische Struktur ein
      '5': bringt in wechselnde Kontakte Beweglichkeit und Offenheit fuer Neues ein
      '6': bringt in wechselnde Kontakte Fuersorge und Verantwortungsbewusstsein ein
      '7': bringt in wechselnde Kontakte Tiefe, Reflexion und Klarheit ein
      '8': bringt in wechselnde Kontakte Zielstrebigkeit und Umsetzungskraft ein
      '9': bringt in wechselnde Kontakte Grosszuegigkeit und weiten Blick ein
      '11': bringt in wechselnde Kontakte Intuition und Sensibilitaet fuer Zwischentoene ein
      '22': bringt in wechselnde Kontakte visionaeres, strukturiertes Denken ein
      '33': bringt in wechselnde Kontakte warmherzige, ausgleichende Praesenz ein
