relationship_type: PARTNER
dimensions:
  communication:
    semantic_context_de: Wie beide Partner Gedanken, Beduerfnisse und Gefuehle typischerweise ausdruecken
      und aufnehmen -- Tonfall, Direktheit, Zuhoerverhalten. Eine deskriptive Linse auf Ausdrucksstil,
      keine Bewertung von "guter" oder "schlechter" Kommunikation.
    number_modifiers:
      '1': direkt, entscheidungsfreudig, kann ungeduldig mit langen Aushandlungen wirken
      '2': einfuehlsam, sucht Konsens, vermeidet moeglicherweise klare Aussagen bei Spannung
      '3': ausdrucksstark, verspielt, neigt zu Ablenkung bei ernsten Themen
      '4': sachlich, strukturiert, bevorzugt klare Absprachen vor spontanem Austausch
      '5': spontan, abwechslungsreich, kann bei Routine-Gespraechen unruhig werden
      '6': fuersorglich, harmonieorientiert, neigt zu indirekter Kritik aus Ruecksicht
      '7': reflektiert, waegt Worte ab, braucht oft Zeit vor einer Antwort
      '8': zielgerichtet, ergebnisorientiert, kann in Diskussionen dominant wirken
      '9': grosszuegig im Zuhoeren, idealistisch formuliert, vermeidet moeglicherweise Konfrontation
      '11': intuitiv, sensibel fuer Untertoene, kann bei Reizueberflutung verstummen
      '22': strukturiert und visionaer zugleich, formuliert oft mit Blick aufs grosse Ganze
      '33': warmherzig, ausgleichend, stellt eigene Anliegen manchmal zurueck
  closeness:
    semantic_context_de: Wie Naehe, Zeit zu zweit und emotionale Verbundenheit typischerweise erlebt und
      gesucht werden -- Tempo, Intensitaet, bevorzugte Ausdrucksformen von Zuneigung.
    number_modifiers:
      '1': schaetzt Naehe, die Eigenstaendigkeit nicht einschraenkt
      '2': sucht haeufige, verlaessliche emotionale Naehe
      '3': erlebt Naehe oft ueber gemeinsame Erlebnisse und Leichtigkeit
      '4': baut Naehe langsam und ueber Verlaesslichkeit auf
      '5': braucht abwechslungsreiche Formen von Naehe, nicht nur Routine
      '6': zeigt Naehe durch Fuersorge und praktische Unterstuetzung
      '7': braucht regelmaessige Rueckzugsraeume neben der Naehe
      '8': verbindet Naehe oft mit gemeinsamen Zielen und Verlaesslichkeit
      '9': erlebt Naehe in der Partnerschaft als Teil eines groesseren, mitfuehlenden Miteinanders
      '11': erlebt Naehe intensiv und intuitiv, manchmal ueberwaeltigend
      '22': verbindet Naehe mit gemeinsamer langfristiger Ausrichtung
      '33': gibt viel Naehe, sollte auf eigene Beduerfnisse darin achten
  autonomy:
    semantic_context_de: Wie viel eigenstaendiger Raum -- Zeit, Entscheidungen, Interessen -- innerhalb
      der Partnerschaft typischerweise gebraucht wird, unabhaengig von der Naehe zum Partner.
    number_modifiers:
      '1': braucht auch in der Partnerschaft eigenstaendige Entscheidungsspielraeume
      '2': stellt eigene Autonomie in der Partnerschaft oft hinter das gemeinsame Miteinander zurueck
      '3': braucht auch in der Partnerschaft Raum fuer eigene Ausdrucksformen und weitere soziale Kontakte
      '4': definiert Autonomie in der Partnerschaft oft ueber eigene Strukturen und feste Zustaendigkeiten
      '5': braucht auch in der Partnerschaft viel Freiheit und reagiert empfindlich auf Einengung
      '6': stellt in der Partnerschaft eigenen Freiraum haeufig hinter die Beduerfnisse des Partners zurueck
      '7': braucht auch in der Partnerschaft regelmaessig ungestoerten Rueckzug und eigenen Gedankenraum
      '8': braucht Autonomie vor allem in beruflichen/zielbezogenen Bereichen
      '9': definiert Freiraum in der Partnerschaft oft ueber gemeinsame Sinn- und Wertefragen
      '11': braucht auch in enger Partnerschaft Rueckzug, um sensible Eindruecke zu verarbeiten
      '22': verbindet eigenen Freiraum in der Partnerschaft mit Verantwortung fuer gemeinsame grosse Vorhaben
      '33': sollte in der Partnerschaft aktiv eigenen Freiraum einfordern, statt ihn stillschweigend zugunsten
        des Miteinanders aufzugeben
  needs:
    semantic_context_de: Beschreibende Reflexion typischer emotionaler Grundbeduerfnisse in einer Partnerschaft
      -- Anerkennung, Sicherheit, Anregung, Verlaesslichkeit. Ein symbolisches Deutungsangebot, keine
      klinische Einordnung.
    number_modifiers:
      '1': braucht in der Partnerschaft Anerkennung der eigenen Initiative und Eigenstaendigkeit
      '2': braucht in der Partnerschaft Verlaesslichkeit und das Gefuehl, gebraucht zu werden
      '3': Wertschaetzung fuer Kreativitaet und Lebendigkeit
      '4': braucht in der Partnerschaft Sicherheit durch klare Absprachen und Verlaesslichkeit
      '5': braucht in der Partnerschaft Abwechslung und das Gefuehl, nicht eingeengt zu sein
      '6': braucht in der Partnerschaft Wertschaetzung der eigenen Fuersorge, ohne sie als selbstverstaendlich
        zu nehmen
      '7': braucht in der Partnerschaft Respekt vor dem eigenen Rueckzugsbeduerfnis
      '8': Anerkennung von Leistung und gemeinsamer Zielverfolgung
      '9': braucht in der Partnerschaft das Gefuehl, dass die eigenen Ideale geteilt oder respektiert
        werden
      '11': braucht in der Partnerschaft Verstaendnis fuer die eigene emotionale Sensibilitaet
      '22': braucht in der Partnerschaft Unterstuetzung fuer langfristige, groessere Vorhaben
      '33': braucht in der Partnerschaft Ausgleich -- das eigene Geben sollte auch erwidert werden
  strengths:
    semantic_context_de: Woraus die Partnerschaft typischerweise Kraft zieht -- komplementaere oder gemeinsame
      Staerken beider Zahlen, symbolisch gelesen, nicht als Garantie.
    number_modifiers:
      '1': bringt in die Partnerschaft Initiative und klare Richtung ein
      '2': bringt in die Partnerschaft Ausgleich, Kooperationsbereitschaft und Feingefuehl ein
      '3': bringt in die Partnerschaft Leichtigkeit, Ausdrucksfreude und Verbindungskraft ein
      '4': bringt in die Partnerschaft Verlaesslichkeit und praktische Struktur ein
      '5': bringt in die Partnerschaft Beweglichkeit und Offenheit fuer Neues ein
      '6': bringt in die Partnerschaft Fuersorge und Verantwortungsbewusstsein ein
      '7': bringt in die Partnerschaft Tiefe, Reflexion und Klarheit ein
      '8': bringt in die Partnerschaft Zielstrebigkeit und Umsetzungskraft ein
      '9': bringt in die Partnerschaft Grosszuegigkeit und weiten Blick ein
      '11': bringt in die Partnerschaft Intuition und Sensibilitaet fuer Zwischentoene ein
      '22': bringt in die Partnerschaft visionaeres, strukturiertes Denken ein
      '33': bringt in die Partnerschaft warmherzige, ausgleichende Praesenz ein
  conflict_dynamics:
    semantic_context_de: Wie Konflikte typischerweise entstehen und ausgetragen werden -- Eskalations-
      und Rueckzugsmuster, symbolisch aus dem Zahlenprofil gelesen, nie als Vorhersage, sondern als Reflexionsangebot.
    number_modifiers:
      '1': neigt bei Widerstand in der Partnerschaft zu Ungeduld oder Alleingaengen
      '2': neigt bei Konflikt zu Konfliktvermeidung statt offener Aussprache
      '3': neigt zu Zerstreuung oder Themenwechsel statt Klaerung
      '4': neigt in der Partnerschaft zu Rigiditaet und Festhalten am eigenen Standpunkt
      '5': neigt in der Partnerschaft zu Rueckzug in Ablenkung statt Auseinandersetzung
      '6': neigt in der Partnerschaft zu Ueberverantwortung -- uebernimmt Schuld, um Frieden zu wahren
      '7': neigt in der Partnerschaft zu emotionalem Rueckzug und Distanz statt Aussprache
      '8': neigt in der Partnerschaft zu Kontrolle und Machtkonflikten statt Kompromiss
      '9': neigt in der Partnerschaft zu Selbstaufgabe, um Harmonie zu erzwingen
      '11': neigt in der Partnerschaft zu Ueberempfindlichkeit bei wahrgenommener Kritik
      '22': neigt in der Partnerschaft dazu, grosse Plaene ueber akute Spannungen zu stellen
      '33': neigt in der Partnerschaft dazu, eigene Grenzen zu spaet zu setzen
