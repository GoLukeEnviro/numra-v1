metric_id: attitude
display_name_de: Einstellungszahl
semantic_context_de: Die Einstellungszahl beschreibt, wie eine Person nach außen auf andere Menschen und
  neue Situationen zunächst reagiert — den ersten Eindruck und die spontane Haltung, nicht die tiefere
  Persönlichkeit. Sie ergibt sich aus Monat und Tag des Geburtsdatums und wird in der Numerologie als
  schneller, oberflaechennaher Reflex gelesen, der sich von der langfristigeren Ausrichtung der Lebenszahl
  unterscheiden kann.
