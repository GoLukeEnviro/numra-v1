metric_id: life_path
display_name_de: Lebenszahl
semantic_context_de: Die Lebenszahl beschreibt die grundlegende Ausrichtung und den übergeordneten Entwicklungsweg
  eines Lebens, wie er sich aus dem vollständigen Geburtsdatum ergibt. Sie gilt in der Numerologie oft
  als zentraler Ausgangspunkt eines Profils. Sie ergibt sich aus der Reduktion des vollstaendigen Geburtsdatums
  (Tag, Monat, Jahr) und bleibt im Unterschied zu den Timing-Zahlen ueber das gesamte Leben unveraendert.
