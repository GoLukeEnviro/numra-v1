metric_id: life_path
display_name_de: Lebenszahl
semantic_context_de: Die Lebenszahl beschreibt die grundlegende Ausrichtung und den
  übergeordneten Entwicklungsweg eines Lebens, wie er sich aus dem vollständigen Geburtsdatum
  ergibt. Sie gilt in der Numerologie oft als zentraler Ausgangspunkt eines Profils.
meaning_paragraph_de: Die Lebenszahl ist die Linse für Richtung über Jahre — kein Charakteretikett
  und keine Vorhersage einzelner Ereignisse. Sie beschreibt, woran sich Entwicklung immer
  wieder reibt, nicht was unweigerlich passiert.
