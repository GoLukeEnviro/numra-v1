semantic_context_de: Die Lebenszahl beschreibt die grundlegende Ausrichtung und den
  übergeordneten Entwicklungsweg eines Lebens, wie er sich aus dem vollständigen Geburtsdatum
  ergibt. Sie gilt in der Numerologie oft als zentraler Ausgangspunkt eines Profils.
