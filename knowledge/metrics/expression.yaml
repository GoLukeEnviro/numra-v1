metric_id: expression
display_name_de: Ausdruckszahl
semantic_context_de: Die Ausdruckszahl (auch Schicksalszahl genannt) ergibt sich aus dem vollständigen
  Geburtsnamen und beschreibt die Summe der Fähigkeiten, Talente und Potentiale, die eine Person mitbringt
  und im Lauf des Lebens entfalten kann. Sie ergaenzt die Seelendrangzahl (inneren Antrieb) und die Persoenlichkeitszahl
  (aeusseren Eindruck) um die Dimension des Koennens und Potentials.
