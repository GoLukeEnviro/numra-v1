metric_id: subconscious_self
display_name_de: Unterbewusstsein
semantic_context_de: Diese Kennzahl beschreibt symbolisch, wie viele unterschiedliche Grundwerte im Namen
  vertreten sind, und wird als Hinweis auf unbewusstes Vertrauen oder Reaktionsfähigkeit in unerwarteten
  Situationen gedeutet. Sie baut rechnerisch auf der Intensitaetstabelle auf und wird als Mass fuer die
  Bandbreite eingesetzter Themen gelesen, nicht fuer deren einzelne Auspraegung.
