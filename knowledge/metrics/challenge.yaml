metric_id: challenge
display_name_de: Herausforderungszahl
semantic_context_de: Eine Herausforderungszahl beschreibt ein wiederkehrendes Thema oder eine Reibungsfläche,
  an der sich eine Person während einer bestimmten Lebensphase symbolisch abarbeiten kann. Sie wird aus
  Differenzen einzelner Bestandteile des Geburtsdatums gebildet und liegt typischerweise in mehreren,
  aufeinanderfolgenden Lebensabschnitten vor.
