metric_id: pinnacle
display_name_de: Pinnacle (Lebensgipfel)
semantic_context_de: Ein Pinnacle beschreibt eine von vier aufeinanderfolgenden Lebensphasen mit jeweils
  eigenem thematischem Schwerpunkt, der über einen bestimmten Altersabschnitt hinweg symbolisch wirksam
  sein soll. Die vier Pinnacles ergeben sich aus Kombinationen von Geburtstag, -monat und -jahr und loesen
  einander in Altersabschnitten ab, die von der Lebenszahl mitbestimmt werden.
