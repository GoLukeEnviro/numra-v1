metric_id: birthday
display_name_de: Geburtstagszahl
semantic_context_de: Die Geburtstagszahl leitet sich allein aus dem Tag des Monats ab und beschreibt eine
  zusätzliche, eher alltagsnahe Facette der Persönlichkeit — ein Talent oder eine Neigung, die den grundsätzlichen
  Lebensweg ergänzt. Sie wird traditionell als kleinere, aber eigenstaendige Ergaenzung zur Lebenszahl
  gelesen, nicht als deren Ersatz.
