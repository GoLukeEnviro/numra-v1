metric_id: personal_year
display_name_de: Persönliches Jahr
semantic_context_de: Das Persönliche Jahr beschreibt die thematische Grundfärbung eines konkreten Kalenderjahres
  für eine Person und wird jährlich neu berechnet, im Unterschied zu den überdauernden Kernzahlen. Es
  ergibt sich aus Tag und Monat des Geburtsdatums in Kombination mit dem jeweiligen Kalenderjahr und bildet
  die Grundlage fuer den Persoenlichen Monat und Tag.
