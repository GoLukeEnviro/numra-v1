metric_id: personality
display_name_de: Persönlichkeitszahl
semantic_context_de: Die Persönlichkeitszahl entsteht aus den Konsonanten des Geburtsnamens und beschreibt
  den äußeren Eindruck, den eine Person auf andere macht — im Gegensatz zum inneren Antrieb der Seelendrangzahl.
  Zusammen mit der Seelendrangzahl und der Ausdruckszahl ergibt sie das vollstaendige Bild aus dem Geburtsnamen.
