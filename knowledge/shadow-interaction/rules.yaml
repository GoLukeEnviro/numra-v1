# Deterministische Lookup-Tabelle (shadow_theme_a, shadow_theme_b) -> Interaktionsmuster-Templates.
# Deckt alle paarweisen Kombinationen der primaeren Schattenthemen ab, die bei Life Path 1-9
# zwischen zwei Profilen auftreten koennen (aus knowledge/numbers/*.yaml shadows[0] abgeleitet).
# Der primaere Schattenwert eines Profils ist deterministisch shadows[0] der Life-Path-Zahl --
# siehe context.py::_primary_shadow_theme. Diese Vereinfachung (ein Thema statt der vollen
# shadows-Liste pro Zahl) haelt die Tabelle auf 45 Zeilen (9 choose 2 + 9 Diagonal-Faelle)
# statt kombinatorisch zu explodieren; dokumentiert im PR-Abschlussbericht.
rules:
  - shadow_theme_a: "Dominanz"
    shadow_theme_b: "Dominanz"
    interaction_pattern_template_id: "pattern_1_1"
    escalation_loop_template: >-
      Wenn beide Seiten zu Dominanz neigen, kann sich dieses Muster gegenseitig verstaerken: keine Seite bringt eine ausgleichende Gegenbewegung ein, wodurch sich die Dynamik unbemerkt vertiefen kann.
    deescalation_template: >-
      Beide Seiten koennen die gemeinsame Neigung zu Dominanz offen benennen und bewusst eine ergaenzende Verhaltensweise einbringen, statt sich gegenseitig darin zu bestaerken.
  - shadow_theme_a: "Dominanz"
    shadow_theme_b: "Unentschlossenheit"
    interaction_pattern_template_id: "pattern_1_2"
    escalation_loop_template: >-
      Wenn die Neigung zu Dominanz bei der einen Seite auf die Neigung zu Unentschlossenheit bei der anderen Seite trifft, kann ein Muster entstehen, in dem beide Reaktionen sich wechselseitig verstaerken, solange keine Seite die eigene Neigung bewusst reflektiert.
    deescalation_template: >-
      Ein bewusstes Benennen der eigenen Neigung zu Dominanz bzw. Unentschlossenheit kann beiden Seiten helfen, aus dem automatischen Reaktionsmuster auszusteigen und eine gemeinsame Klaerung zu suchen, statt die jeweilige Schattenseite unbewusst auszuleben.
