# Deterministische Lookup-Tabelle (shadow_theme_a, shadow_theme_b) -> Interaktionsmuster-Templates.
# Deckt alle paarweisen Kombinationen der primären Schattenthemen ab, die bei Life Path 1-9
# sowie 11/22/33 zwischen zwei Profilen auftreten können (aus knowledge/numbers/*.yaml und
# knowledge/master-numbers/*.yaml shadows[0] abgeleitet). Der primäre Schattenwert eines
# Profils ist deterministisch shadows[0] der Life-Path-Zahl -- siehe context.py::primary_shadow_theme.
# Diese Vereinfachung (ein Thema statt der vollen shadows-Liste pro Zahl) hält die Tabelle auf
# 78 Zeilen (C(12,2) + 12 Diagonal-Fälle) statt kombinatorisch zu explodieren; die 33 Master-
# Zeilen wenden dasselbe Template-Muster auf die kuratierten master-numbers/*.yaml-Themen an.
#
# Wave 3 Schritt 5 (siehe knowledge/AUTHORING_GUIDE.md): alle 78 Zeilen -- die 12 Diagonal-Zeilen
# (shadow_theme_a == shadow_theme_b, Batch 1) und die 66 Off-Diagonal-Zeilen (Batches 2-7) --
# sind themenspezifisch neu verfasst statt generisch templated. Jede Zeile hat eine eigene,
# von allen anderen Zeilen verschiedene escalation_loop_template/deescalation_template-Formulierung.
rules:
- shadow_theme_a: Dominanz
  shadow_theme_b: Dominanz
  interaction_pattern_template_id: pattern_1_1
  escalation_loop_template: Wenn beide Seiten zur Dominanz neigen, kann sich ein Muster aus wiederholten
    Konkurrenzsituationen entwickeln, in dem beide um die Führungsrolle ringen, statt sie zu teilen —
    kleine Meinungsverschiedenheiten können sich so zu Grundsatzfragen aufschaukeln.
  deescalation_template: Eine bewusst vereinbarte Aufteilung, wer in welchem Bereich die Führung übernimmt,
    kann beiden Seiten Raum geben, ohne dass eine Seite dauerhaft nachgeben muss.
- shadow_theme_a: Dominanz
  shadow_theme_b: Unentschlossenheit
  interaction_pattern_template_id: pattern_1_2
  escalation_loop_template: Wenn die eine Seite zur Dominanz neigt und die andere zur Unentschlossenheit,
    kann sich ein Muster einspielen, in dem die entscheidungsfreudige Seite automatisch die Führung übernimmt
    und die zögernde Seite sich zunehmend zurückzieht, statt eigene Vorstellungen einzubringen.
  deescalation_template: Ein bewusst geschaffener Raum, in dem die zögernde Seite zuerst gefragt wird,
    kann verhindern, dass sich die Rollenverteilung unbemerkt verfestigt, ohne dass die entscheidungsfreudige
    Seite ihre Klarheit aufgeben muss.
- shadow_theme_a: Dominanz
  shadow_theme_b: Zerstreuung
  interaction_pattern_template_id: pattern_1_3
  escalation_loop_template: Wenn die eine Seite zur Dominanz neigt und die andere zur Zerstreuung, kann
    die bestimmende Seite zunehmend die Nachverfolgung gemeinsamer Vorhaben übernehmen, während die zerstreute
    Seite sich stillschweigend aus der Verantwortung zieht.
  deescalation_template: Eine klar vereinbarte, aber begrenzte Zuständigkeit für die zerstreute Seite
    kann beiden helfen, aus dem Muster auszusteigen, in dem eine Seite alles organisiert und die andere
    nichts mehr nachhält.
- shadow_theme_a: Dominanz
  shadow_theme_b: Rigidität
  interaction_pattern_template_id: pattern_1_4
  escalation_loop_template: Wenn die eine Seite zur Dominanz neigt und die andere zur Rigidität, können
    Machtfragen und Grundsatzfragen ineinander übergehen — ein Vorschlag der dominanten Seite kann auf
    unbeweglichen Widerstand treffen, der sich rasch zu einem Prinzipienstreit ausweiten kann.
  deescalation_template: Eine bewusste Trennung zwischen 'wer entscheidet' und 'wie es gemacht wird' kann
    beiden Seiten helfen, Machtfragen von inhaltlichen Fragen zu lösen.
- shadow_theme_a: Dominanz
  shadow_theme_b: Rastlosigkeit
  interaction_pattern_template_id: pattern_1_5
  escalation_loop_template: Wenn die eine Seite zur Dominanz neigt und die andere zur Rastlosigkeit, kann
    die bestimmende Seite versuchen, Stabilität durchzusetzen, während die rastlose Seite genau das als
    Einengung erlebt — ein Muster aus Druck und Ausweichen kann entstehen.
  deescalation_template: Ein gemeinsam vereinbarter Rahmen, der sowohl feste Punkte als auch Freiräume
    enthält, kann beiden Seiten Sicherheit geben, ohne dass eine Seite die andere kontrollieren muss.
- shadow_theme_a: Dominanz
  shadow_theme_b: Überverantwortung
  interaction_pattern_template_id: pattern_1_6
  escalation_loop_template: Wenn die eine Seite zur Dominanz neigt und die andere zur Überverantwortung,
    kann sich eine Dynamik einspielen, in der die bestimmende Seite Entscheidungen trifft und die überverantwortliche
    Seite automatisch die Folgen davon mitträgt, auch wenn sie nicht einverstanden war.
  deescalation_template: Eine klare Kopplung von Entscheidung und Verantwortung — wer entscheidet, trägt
    die Konsequenzen mit — kann beiden Seiten helfen, aus dieser stillschweigenden Aufgabenteilung auszusteigen.
- shadow_theme_a: Dominanz
  shadow_theme_b: Rückzug
  interaction_pattern_template_id: pattern_1_7
  escalation_loop_template: Wenn die eine Seite zur Dominanz neigt und die andere zum Rückzug, kann die
    bestimmende Seite den Rückzug der anderen als Zustimmung deuten, während die zurückgezogene Seite
    ihre eigentliche Position gar nicht mehr äußert.
  deescalation_template: Eine ausdrückliche Nachfrage der dominanten Seite, bevor eine Entscheidung als
    geteilt gilt, kann der zurückgezogenen Seite Raum geben, ihre Sicht doch noch einzubringen.
- shadow_theme_a: Dominanz
  shadow_theme_b: Kontrolle
  interaction_pattern_template_id: pattern_1_8
  escalation_loop_template: Wenn die eine Seite zur Dominanz neigt und die andere zur Kontrolle, können
    sich Führungsanspruch und Detailkontrolle überschneiden — die eine Seite möchte die Richtung vorgeben,
    die andere jeden Schritt bestimmen, was zu wiederkehrenden Reibungen führen kann.
  deescalation_template: Eine klare Trennung zwischen grober Richtung und Umsetzungsdetails kann beiden
    Seiten den jeweils eigenen Bereich lassen, ohne sich gegenseitig zu blockieren.
- shadow_theme_a: Dominanz
  shadow_theme_b: Selbstaufgabe
  interaction_pattern_template_id: pattern_1_9
  escalation_loop_template: Wenn die eine Seite zur Dominanz neigt und die andere zur Selbstaufgabe, kann
    sich eine Schieflage verfestigen, in der die bestimmende Seite zunehmend mehr Raum einnimmt, weil
    die andere Seite kaum widerspricht.
  deescalation_template: Eine bewusste Einladung der dominanten Seite, die Meinung der anderen Seite aktiv
    einzufordern, kann helfen, die Schieflage auszugleichen, ohne dass die zurückhaltende Seite sich aufdrängen
    muss.
- shadow_theme_a: Unentschlossenheit
  shadow_theme_b: Unentschlossenheit
  interaction_pattern_template_id: pattern_2_2
  escalation_loop_template: Wenn beide Seiten zu Unentschlossenheit neigen, können gemeinsame Entscheidungen
    ins Stocken geraten, weil keine Seite den ersten klaren Vorschlag macht — aus Rücksicht kann so wechselseitiges
    Zögern entstehen, das Themen unbearbeitet lässt.
  deescalation_template: Eine feste Abmachung, abwechselnd den ersten Vorschlag zu machen, kann beiden
    Seiten helfen, aus dem gegenseitigen Abwarten auszusteigen, ohne dass sich eine Seite übergangen fühlt.
- shadow_theme_a: Unentschlossenheit
  shadow_theme_b: Zerstreuung
  interaction_pattern_template_id: pattern_2_3
  escalation_loop_template: Wenn die eine Seite zur Unentschlossenheit neigt und die andere zur Zerstreuung,
    können gemeinsame Entscheidungen gleich doppelt ins Stocken geraten — die eine Seite zögert, die andere
    verliert parallel den Faden, sodass Themen unbeabsichtigt versanden.
  deescalation_template: Eine kurze, verbindliche Frist für offene Entscheidungen kann beiden Seiten helfen,
    Themen abzuschließen, bevor sie im gegenseitigen Zögern und Verlieren des Überblicks untergehen.
- shadow_theme_a: Unentschlossenheit
  shadow_theme_b: Rigidität
  interaction_pattern_template_id: pattern_2_4
  escalation_loop_template: Wenn die eine Seite zur Unentschlossenheit neigt und die andere zur Rigidität,
    kann die zögernde Seite eine bereits feststehende Position der anderen kaum noch infrage stellen,
    wodurch sich Entscheidungen einseitig verfestigen können, ohne dass ein echter Austausch stattfindet.
  deescalation_template: Eine bewusst eingeräumte Bedenkzeit vor endgültigen Festlegungen kann der zögernden
    Seite Raum geben, die eigene Position zu finden, bevor sie sich der feststehenden Haltung der anderen
    einfach anschließt.
- shadow_theme_a: Unentschlossenheit
  shadow_theme_b: Rastlosigkeit
  interaction_pattern_template_id: pattern_2_5
  escalation_loop_template: Wenn die eine Seite zur Unentschlossenheit neigt und die andere zur Rastlosigkeit,
    kann die rastlose Seite ungeduldig vorpreschen, während die zögernde Seite kaum hinterherkommt — Entscheidungen
    können so getroffen werden, bevor beide Seiten wirklich einverstanden sind.
  deescalation_template: Ein bewusst eingeplanter kurzer Moment vor jeder Entscheidung, in dem beide Seiten
    ausdrücklich gefragt werden, kann verhindern, dass Tempo und Zögern unausgesprochen aneinander vorbeilaufen.
- shadow_theme_a: Unentschlossenheit
  shadow_theme_b: Überverantwortung
  interaction_pattern_template_id: pattern_2_6
  escalation_loop_template: Wenn die eine Seite zur Unentschlossenheit neigt und die andere zur Überverantwortung,
    kann die überverantwortliche Seite automatisch einspringen und entscheiden, sobald die andere zögert
    — mit der Zeit kann sich so eine feste Rollenverteilung einschleifen, die niemand bewusst gewählt
    hat.
  deescalation_template: Eine bewusste Pause, bevor die überverantwortliche Seite die Entscheidung übernimmt,
    kann der zögernden Seite die Chance geben, doch noch eine eigene Position zu finden.
- shadow_theme_a: Unentschlossenheit
  shadow_theme_b: Rückzug
  interaction_pattern_template_id: pattern_2_7
  escalation_loop_template: Wenn die eine Seite zur Unentschlossenheit neigt und die andere zum Rückzug,
    können offene Fragen doppelt unbeantwortet bleiben — keine Seite macht den ersten klaren Schritt,
    sodass Themen über längere Zeit ungeklärt liegen bleiben können.
  deescalation_template: Eine dritte, neutrale Gelegenheit — etwa ein fester Termin nur für offene Themen
    — kann beiden Seiten einen Anlass geben, aus dem gemeinsamen Vermeiden auszusteigen.
- shadow_theme_a: Unentschlossenheit
  shadow_theme_b: Kontrolle
  interaction_pattern_template_id: pattern_2_8
  escalation_loop_template: Wenn die eine Seite zur Unentschlossenheit neigt und die andere zur Kontrolle,
    kann die kontrollierende Seite zunehmend jede offene Frage selbst entscheiden, weil die andere ohnehin
    zögert — die zögernde Seite verliert dabei mit der Zeit den Anlass, eigene Vorstellungen zu entwickeln.
  deescalation_template: Eine bewusst der zögernden Seite überlassene, klar abgegrenzte Entscheidung kann
    beiden helfen, aus der Gewohnheit auszusteigen, dass eine Seite automatisch alles bestimmt.
- shadow_theme_a: Unentschlossenheit
  shadow_theme_b: Selbstaufgabe
  interaction_pattern_template_id: pattern_2_9
  escalation_loop_template: Wenn die eine Seite zur Unentschlossenheit neigt und die andere zur Selbstaufgabe,
    können beide Seiten dazu neigen, eigene Wünsche zurückzuhalten — eine gemeinsame Entscheidung kann
    so zu einem Aushandeln werden, bei dem am Ende niemand wirklich sagt, was er oder sie will.
  deescalation_template: Eine Regel, dass jede Seite mindestens einen eigenen Wunsch offen benennt, bevor
    eine Entscheidung fällt, kann beiden helfen, aus dem gemeinsamen Zurückhalten auszusteigen.
- shadow_theme_a: Zerstreuung
  shadow_theme_b: Zerstreuung
  interaction_pattern_template_id: pattern_3_3
  escalation_loop_template: Wenn beide Seiten zur Zerstreuung neigen, können gemeinsame Vorhaben leicht
    liegen bleiben, weil keine Seite die Nachverfolgung übernimmt — Verabredungen und Pläne können so
    unbemerkt versanden.
  deescalation_template: Ein gemeinsam geführter, sichtbarer Ort für offene Vorhaben kann beiden Seiten
    helfen, den Überblick zu behalten, ohne dass eine Seite die alleinige Organisationsrolle übernehmen
    muss.
- shadow_theme_a: Zerstreuung
  shadow_theme_b: Rigidität
  interaction_pattern_template_id: pattern_3_4
  escalation_loop_template: Wenn die eine Seite zur Zerstreuung neigt und die andere zur Rigidität, kann
    die unstrukturierte Seite als unzuverlässig erlebt werden, während die starre Seite als einengend
    wahrgenommen wird — beide Zuschreibungen können sich in wiederkehrenden Konflikten verfestigen.
  deescalation_template: Eine gemeinsam vereinbarte, aber bewusst locker gehaltene Struktur kann der zerstreuten
    Seite Halt geben, ohne die Flexibilität zu verlieren, die die starre Seite sonst einengt.
- shadow_theme_a: Zerstreuung
  shadow_theme_b: Rastlosigkeit
  interaction_pattern_template_id: pattern_3_5
  escalation_loop_template: Wenn die eine Seite zur Zerstreuung neigt und die andere zur Rastlosigkeit,
    können gemeinsame Vorhaben leicht ins Uferlose geraten — ständig beginnt Neues, während wenig zu einem
    Abschluss kommt.
  deescalation_template: Eine bewusst begrenzte Anzahl gleichzeitiger Vorhaben kann beiden Seiten helfen,
    tatsächlich etwas abzuschließen, statt sich gegenseitig in immer neue Richtungen zu ziehen.
- shadow_theme_a: Zerstreuung
  shadow_theme_b: Überverantwortung
  interaction_pattern_template_id: pattern_3_6
  escalation_loop_template: Wenn die eine Seite zur Zerstreuung neigt und die andere zur Überverantwortung,
    kann die überverantwortliche Seite zunehmend das auffangen, was die zerstreute Seite liegen lässt
    — mit der Zeit kann daraus eine stille Erschöpfung auf der einen und ein unbemerktes Ausbleiben von
    Konsequenzen auf der anderen Seite entstehen.
  deescalation_template: Ein offenes Gespräch darüber, was tatsächlich liegen bleibt und wer es aktuell
    auffängt, kann beiden Seiten helfen, die Aufgabenverteilung bewusster zu gestalten.
- shadow_theme_a: Zerstreuung
  shadow_theme_b: Rückzug
  interaction_pattern_template_id: pattern_3_7
  escalation_loop_template: Wenn die eine Seite zur Zerstreuung neigt und die andere zum Rückzug, können
    gemeinsame Themen gleich doppelt aus dem Blick geraten — die eine Seite verliert den Überblick, die
    andere zieht sich zurück, sodass am Ende niemand die Fäden zusammenhält.
  deescalation_template: Ein einfacher, gemeinsam einsehbarer Überblick über offene Themen kann beiden
    Seiten helfen, auch dann den Anschluss zu behalten, wenn Aufmerksamkeit und Nähe gerade schwanken.
- shadow_theme_a: Zerstreuung
  shadow_theme_b: Kontrolle
  interaction_pattern_template_id: pattern_3_8
  escalation_loop_template: Wenn die eine Seite zur Zerstreuung neigt und die andere zur Kontrolle, kann
    die kontrollierende Seite zunehmend jedes Detail selbst übernehmen, weil sie der zerstreuten Seite
    wenig zutraut — die zerstreute Seite verliert dabei mit der Zeit den Anlass, selbst Verantwortung
    zu zeigen.
  deescalation_template: Ein bewusst kleiner, klar abgegrenzter Bereich, den die zerstreute Seite eigenständig
    verantwortet, kann beiden helfen, aus der Gewohnheit auszusteigen, dass eine Seite alles kontrolliert.
- shadow_theme_a: Zerstreuung
  shadow_theme_b: Selbstaufgabe
  interaction_pattern_template_id: pattern_3_9
  escalation_loop_template: Wenn die eine Seite zur Zerstreuung neigt und die andere zur Selbstaufgabe,
    kann die selbstaufopfernde Seite stillschweigend ausgleichen, was die zerstreute Seite liegen lässt,
    ohne dass dies je offen angesprochen wird.
  deescalation_template: Ein regelmäßiger, kurzer Austausch darüber, was gerade tatsächlich anfällt und
    wer es übernimmt, kann beiden Seiten helfen, den stillen Ausgleich sichtbar zu machen.
- shadow_theme_a: Rigidität
  shadow_theme_b: Rigidität
  interaction_pattern_template_id: pattern_4_4
  escalation_loop_template: Wenn beide Seiten zur Rigidität neigen, können unterschiedliche Vorstellungen
    von der richtigen Vorgehensweise aufeinandertreffen und sich gegenseitig verhärten, weil keine Seite
    leicht von der eigenen Position abrückt.
  deescalation_template: Ein bewusst vereinbarter Testzeitraum für eine ungewohnte Vorgehensweise kann
    beiden Seiten die Möglichkeit geben, Flexibilität ohne Gesichtsverlust zu erproben.
- shadow_theme_a: Rigidität
  shadow_theme_b: Rastlosigkeit
  interaction_pattern_template_id: pattern_4_5
  escalation_loop_template: Wenn die eine Seite zur Rigidität neigt und die andere zur Rastlosigkeit,
    kann der Wunsch nach Veränderung auf der einen Seite auf feste Vorstellungen der anderen treffen —
    beide Seiten können sich dabei wechselseitig als Hindernis erleben.
  deescalation_template: Eine bewusst vereinbarte, begrenzte Zone für Veränderung innerhalb eines ansonsten
    stabilen Rahmens kann beiden Seiten entgegenkommen, ohne dass eine Seite ihre Grundhaltung aufgeben
    muss.
- shadow_theme_a: Rigidität
  shadow_theme_b: Überverantwortung
  interaction_pattern_template_id: pattern_4_6
  escalation_loop_template: Wenn die eine Seite zur Rigidität neigt und die andere zur Überverantwortung,
    kann die überverantwortliche Seite versuchen, es der starren Seite in jedem Detail recht zu machen
    — die starre Seite kann diese Anpassung als selbstverständlich erleben, ohne die Anstrengung dahinter
    zu bemerken.
  deescalation_template: Ein offenes Ansprechen, wie viel Anpassung tatsächlich gerade geleistet wird,
    kann der starren Seite helfen, die eigenen festen Erwartungen bewusster zu hinterfragen.
- shadow_theme_a: Rigidität
  shadow_theme_b: Rückzug
  interaction_pattern_template_id: pattern_4_7
  escalation_loop_template: Wenn die eine Seite zur Rigidität neigt und die andere zum Rückzug, kann feststehende
    Erwartung auf stilles Ausweichen treffen — Konflikte werden dadurch selten offen ausgetragen, sondern
    schwelen unter der Oberfläche weiter.
  deescalation_template: Eine bewusst kleinere, konkrete Frage statt einer grundsätzlichen Diskussion
    kann der zurückgezogenen Seite leichter fallen zu beantworten, ohne sich einer feststehenden Haltung
    ausgeliefert zu fühlen.
- shadow_theme_a: Rigidität
  shadow_theme_b: Kontrolle
  interaction_pattern_template_id: pattern_4_8
  escalation_loop_template: Wenn die eine Seite zur Rigidität neigt und die andere zur Kontrolle, können
    feste Vorstellungen und der Wunsch, alles im Griff zu behalten, sich gegenseitig verstärken — Abweichungen
    vom gewohnten Vorgehen können auf beiden Seiten schnell als Bedrohung erlebt werden.
  deescalation_template: Ein bewusst verabredeter, kleiner Testraum für eine ungewohnte Vorgehensweise
    kann beiden Seiten zeigen, dass Abweichung nicht zwangsläufig Kontrollverlust bedeutet.
- shadow_theme_a: Rigidität
  shadow_theme_b: Selbstaufgabe
  interaction_pattern_template_id: pattern_4_9
  escalation_loop_template: Wenn die eine Seite zur Rigidität neigt und die andere zur Selbstaufgabe,
    kann sich die selbstaufopfernde Seite den festen Vorstellungen der anderen zunehmend anpassen, ohne
    eigene Bedürfnisse überhaupt noch zu äußern.
  deescalation_template: Eine bewusste, wiederkehrende Nachfrage der starren Seite nach der Meinung der
    anderen kann helfen, dass eigene Bedürfnisse nicht dauerhaft hinter feste Erwartungen zurücktreten.
- shadow_theme_a: Rastlosigkeit
  shadow_theme_b: Rastlosigkeit
  interaction_pattern_template_id: pattern_5_5
  escalation_loop_template: Wenn beide Seiten zur Rastlosigkeit neigen, kann ein gemeinsames Bedürfnis
    nach ständiger Veränderung entstehen, das wenig Raum für Kontinuität und gemeinsame Verbindlichkeit
    lässt.
  deescalation_template: Eine bewusst eingeplante wiederkehrende Konstante — ein fester Termin oder ein
    Ritual — kann beiden Seiten Halt geben, ohne die gemeinsame Offenheit für Neues aufzugeben.
- shadow_theme_a: Rastlosigkeit
  shadow_theme_b: Überverantwortung
  interaction_pattern_template_id: pattern_5_6
  escalation_loop_template: Wenn die eine Seite zur Rastlosigkeit neigt und die andere zur Überverantwortung,
    kann die überverantwortliche Seite zunehmend die Kontinuität sichern, die der rastlosen Seite fehlt
    — mit der Zeit kann daraus eine einseitige Last werden, die kaum noch ausgesprochen wird.
  deescalation_template: Ein offenes Gespräch darüber, wie viel Stabilität gerade wirklich von einer Seite
    allein getragen wird, kann beiden helfen, Verantwortung bewusster zu verteilen.
- shadow_theme_a: Rastlosigkeit
  shadow_theme_b: Rückzug
  interaction_pattern_template_id: pattern_5_7
  escalation_loop_template: Wenn die eine Seite zur Rastlosigkeit neigt und die andere zum Rückzug, kann
    das Bedürfnis nach Bewegung auf der einen Seite die zurückgezogene Seite noch weiter in sich kehren
    lassen, während die rastlose Seite sich davon unbeachtet fühlt.
  deescalation_template: Ein fester, aber kleiner gemeinsamer Anker — ein wiederkehrender ruhiger Moment
    — kann beiden Seiten Kontinuität geben, ohne das Bedürfnis nach Bewegung oder nach Rückzug zu verneinen.
- shadow_theme_a: Rastlosigkeit
  shadow_theme_b: Kontrolle
  interaction_pattern_template_id: pattern_5_8
  escalation_loop_template: Wenn die eine Seite zur Rastlosigkeit neigt und die andere zur Kontrolle,
    kann der Wunsch nach Bewegung auf der einen Seite als Bedrohung der Ordnung auf der anderen Seite
    erlebt werden, was zu wiederkehrenden Auseinandersetzungen über Verlässlichkeit führen kann.
  deescalation_template: Ein gemeinsam vereinbarter, klar abgesteckter Rahmen für spontane Vorhaben kann
    der rastlosen Seite Freiraum geben, ohne dass die kontrollierende Seite die Übersicht verliert.
- shadow_theme_a: Rastlosigkeit
  shadow_theme_b: Selbstaufgabe
  interaction_pattern_template_id: pattern_5_9
  escalation_loop_template: Wenn die eine Seite zur Rastlosigkeit neigt und die andere zur Selbstaufgabe,
    kann sich die selbstaufopfernde Seite den wechselnden Vorhaben der anderen zunehmend unterordnen,
    ohne eigene Wünsche nach Kontinuität überhaupt zu äußern.
  deescalation_template: Eine bewusste Frage der rastlosen Seite, was der anderen Seite eigentlich wichtig
    ist, kann helfen, eigene Bedürfnisse nach Stabilität sichtbar zu machen.
- shadow_theme_a: Überverantwortung
  shadow_theme_b: Überverantwortung
  interaction_pattern_template_id: pattern_6_6
  escalation_loop_template: Wenn beide Seiten zur Überverantwortung neigen, kann ein stilles Wettrennen
    entstehen, wer mehr übernimmt — mit der Zeit kann das beide Seiten erschöpfen, ohne dass jemand um
    Entlastung bittet.
  deescalation_template: Ein offenes Gespräch darüber, welche Aufgaben wirklich geteilt statt einseitig
    übernommen werden, kann beiden Seiten helfen, Verantwortung bewusster zu verteilen.
- shadow_theme_a: Überverantwortung
  shadow_theme_b: Rückzug
  interaction_pattern_template_id: pattern_6_7
  escalation_loop_template: Wenn die eine Seite zur Überverantwortung neigt und die andere zum Rückzug,
    kann die überverantwortliche Seite versuchen, die entstehende Distanz durch noch mehr Einsatz auszugleichen,
