# Deterministische Lookup-Tabelle (shadow_theme_a, shadow_theme_b) -> Interaktionsmuster-Templates.
# Deckt alle paarweisen Kombinationen der primären Schattenthemen ab, die bei Life Path 1-9
# sowie 11/22/33 zwischen zwei Profilen auftreten können (aus knowledge/numbers/*.yaml und
# knowledge/master-numbers/*.yaml shadows[0] abgeleitet). Der primäre Schattenwert eines
# Profils ist deterministisch shadows[0] der Life-Path-Zahl -- siehe context.py::primary_shadow_theme.
# Diese Vereinfachung (ein Thema statt der vollen shadows-Liste pro Zahl) hält die Tabelle auf
# 78 Zeilen (C(12,2) + 12 Diagonal-Fälle) statt kombinatorisch zu explodieren; die 33 Master-
# Zeilen wenden dasselbe Template-Muster auf die kuratierten master-numbers/*.yaml-Themen an.
#
# Wave 3 Schritt 5 (Batch 1, siehe knowledge/AUTHORING_GUIDE.md): die 12 Diagonal-Zeilen (beide
# Profile teilen dasselbe primäre Schattenthema, shadow_theme_a == shadow_theme_b) sind
# themenspezifisch neu verfasst statt generisch templated -- die 66 Off-Diagonal-Zeilen bleiben
# vorerst beim generischen Muster, folgen in späteren Batches.
rules:
- shadow_theme_a: Dominanz
  shadow_theme_b: Dominanz
  interaction_pattern_template_id: pattern_1_1
  escalation_loop_template: Wenn beide Seiten zur Dominanz neigen, kann sich ein Muster aus wiederholten
    Konkurrenzsituationen entwickeln, in dem beide um die Führungsrolle ringen, statt sie zu teilen —
    kleine Meinungsverschiedenheiten können sich so zu Grundsatzfragen aufschaukeln.
  deescalation_template: Eine bewusst vereinbarte Aufteilung, wer in welchem Bereich die Führung übernimmt,
    kann beiden Seiten Raum geben, ohne dass eine Seite dauerhaft nachgeben muss.
- shadow_theme_a: Dominanz
  shadow_theme_b: Unentschlossenheit
  interaction_pattern_template_id: pattern_1_2
  escalation_loop_template: Wenn die Neigung zu Dominanz bei der einen Seite auf die Neigung zu Unentschlossenheit
    bei der anderen Seite trifft, kann ein Muster entstehen, in dem beide Reaktionen sich wechselseitig
    verstärken, solange keine Seite die eigene Neigung bewusst reflektiert.
  deescalation_template: Ein bewusstes Benennen der eigenen Neigung zu Dominanz bzw. Unentschlossenheit
    kann beiden Seiten helfen, aus dem automatischen Reaktionsmuster auszusteigen und eine gemeinsame
    Klärung zu suchen, statt die jeweilige Schattenseite unbewusst auszuleben.
