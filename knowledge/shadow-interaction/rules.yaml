# Deterministische Lookup-Tabelle (shadow_theme_a, shadow_theme_b) -> Interaktionsmuster-Templates.
# Deckt alle paarweisen Kombinationen der primären Schattenthemen ab, die bei Life Path 1-9
# sowie 11/22/33 zwischen zwei Profilen auftreten können (aus knowledge/numbers/*.yaml und
# knowledge/master-numbers/*.yaml shadows[0] abgeleitet). Der primäre Schattenwert eines
# Profils ist deterministisch shadows[0] der Life-Path-Zahl -- siehe context.py::primary_shadow_theme.
# Diese Vereinfachung (ein Thema statt der vollen shadows-Liste pro Zahl) hält die Tabelle auf
# 78 Zeilen (C(12,2) + 12 Diagonal-Fälle) statt kombinatorisch zu explodieren; die 33 Master-
# Zeilen wenden dasselbe Template-Muster auf die kuratierten master-numbers/*.yaml-Themen an.
rules:
  - shadow_theme_a: "Dominanz"
    shadow_theme_b: "Dominanz"
    interaction_pattern_template_id: "pattern_1_1"
    escalation_loop_template: >-
      Wenn beide Seiten zu Dominanz neigen, kann sich dieses Muster gegenseitig verstärken: keine Seite bringt eine ausgleichende Gegenbewegung ein, wodurch sich die Dynamik unbemerkt vertiefen kann.
    deescalation_template: >-
      Beide Seiten können die gemeinsame Neigung zu Dominanz offen benennen und bewusst eine ergänzende Verhaltensweise einbringen, statt sich gegenseitig darin zu bestärken.
  - shadow_theme_a: "Dominanz"
    shadow_theme_b: "Unentschlossenheit"
    interaction_pattern_template_id: "pattern_1_2"
    escalation_loop_template: >-
      Wenn die Neigung zu Dominanz bei der einen Seite auf die Neigung zu Unentschlossenheit bei der anderen Seite trifft, kann ein Muster entstehen, in dem beide Reaktionen sich wechselseitig verstärken, solange keine Seite die eigene Neigung bewusst reflektiert.
    deescalation_template: >-
      Ein bewusstes Benennen der eigenen Neigung zu Dominanz bzw. Unentschlossenheit kann beiden Seiten helfen, aus dem automatischen Reaktionsmuster auszusteigen und eine gemeinsame Klärung zu suchen, statt die jeweilige Schattenseite unbewusst auszuleben.
